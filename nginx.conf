server {
    listen 80;
    server_name thelonesomeera.com www.thelonesomeera.com;

    # Next.js build assets are content-hashed and can be cached indefinitely.
    location ^~ /_next/static/ {
        alias /var/www/thelonesomeera/.next/static/;
        try_files $uri =404;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # `/showcase` is a content namespace; its browseable index lives at `/demo`.
    location = /showcase {
        return 308 /demo;
    }

    location = /showcase/ {
        return 308 /demo;
    }

    # Standalone demos are published beneath public/showcase/<project>/.
    # Existing directories can serve index.html directly; unmatched requests
    # still reach Next.js so checked-in rewrites continue to work.
    location /showcase/ {
        root /var/www/thelonesomeera/public;
        index index.html;
        try_files $uri $uri/index.html @nextjs;
    }

    # The list page is a Next.js route; individual posts are static HTML files.
    location = /blog/ {
        return 308 /blog;
    }

    location /blog/ {
        root /var/www/thelonesomeera/public;
        try_files $uri @nextjs;
    }

    # Shared files from public/. HTML is deliberately excluded so unmatched
    # page requests remain under Next.js routing.
    location ~* \.(css|js|map|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2|woff|ttf|mp3|wav|ogg|mp4|webm|wasm|gltf|glb|bin|xml|txt|json)$ {
        root /var/www/thelonesomeera/public;
        try_files $uri @nextjs;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # `/`, `/demo`, `/blog`, `/about`, and all other application requests.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    location @nextjs {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
