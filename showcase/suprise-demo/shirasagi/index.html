<!doctype html>
<html lang="zh-Hant">
<head><base href="/showcase/suprise-demo/shirasagi/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8e9e4">
  <meta name="description" content="在陰天的秋日城郭自由漫遊，沿石垣觀賞白壁天守與層疊瓦簷。">
  <title>白壁天守 SHIRASAGI — ELSEWHERE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='7' fill='%232b322b'/%3E%3Cpath d='M6 27q7 1 14-7 7 8 14 7M10 20q6 0 10-6 4 6 10 6M14 14q3 0 6-5 3 5 6 5' fill='none' stroke='%23f2efdf' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
  <main id="experience" aria-label="白壁天守 3D 漫遊">
    <div id="stage"></div>
    <div class="shade" aria-hidden="true"></div>
    <header>
      <a class="collection" href="../" aria-label="回到 ELSEWHERE 場景選集">
        <svg viewBox="0 0 46 30" aria-hidden="true"><circle cx="16" cy="15" r="13"/><circle cx="30" cy="15" r="13"/></svg>ELSEWHERE
      </a>
      <div class="tools">
        <div class="spots">
          <button id="location" type="button" aria-controls="locations" aria-expanded="false" aria-label="切換觀景點">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/></svg>
            <span id="current-spot">石垣外庭</span>
            <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="m2 4 4 4 4-4"/></svg>
          </button>
          <div id="locations" hidden aria-label="觀景點"></div>
        </div>
        <span class="tool-divider" aria-hidden="true"></span>
        <button class="icon" id="photo" type="button" aria-label="儲存目前視角的照片" title="拍照"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h5l1.6-2.5h4.8L16 7h5v12H3z"/><circle cx="12" cy="13" r="3.7"/></svg></button>
        <button class="icon" id="fullscreen" type="button" hidden aria-label="進入全螢幕" title="全螢幕"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button>
      </div>
    </header>
    <footer>
      <div id="intro">
        <h1>白壁天守</h1><p lang="en">Shirasagi</p>
      </div>
      <div class="navigation">
        <div class="control-bar">
          <div class="choices" role="group" aria-label="移動模式">
            <button type="button" data-movement="walk" aria-pressed="true">步行</button>
            <button type="button" data-movement="fly" aria-pressed="false">飛行</button>
          </div>
          <button id="explore" type="button">開始漫遊</button>
        </div>
        <p id="controls-hint"></p><span class="sr-only" id="mode-status"></span>
      </div>
    </footer>
    <div id="walk-instructions" hidden><span></span><p id="movement-help"></p></div>
    <div id="crosshair" hidden></div>
    <div id="joystick" aria-label="移動搖桿" hidden><span></span></div>
    <div id="elevation" aria-label="飛行高度" hidden><button type="button" data-elevation="1" aria-label="向上飛行">↑</button><button type="button" data-elevation="-1" aria-label="向下飛行">↓</button></div>
    <div id="toast" role="status"></div>
    <div id="loading" role="status"><div class="line"></div><p>正在載入白壁天守</p></div>
    <div id="error" role="alert" hidden><p id="error-text"></p><button type="button" onclick="location.reload()">重新載入</button><a href="../">回到場景選集</a></div>
  </main>
  <script type="module" src="/src/scenes/shirasagi/main.ts"></script>
</body>
</html>
