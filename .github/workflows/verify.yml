name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            showcase/androidtest/package-lock.json
            showcase/cod2/package-lock.json
            showcase/room/package-lock.json
            showcase/pulsesync/package-lock.json
            showcase/colorful_kart/package-lock.json
            showcase/mini_fantasy/package-lock.json
            showcase/taiwan_night_market/package-lock.json

      - name: Install main dependencies
        run: npm ci

      - name: Install showcase dependencies
        run: npm run ci:showcases

      - name: Run release verification
        run: npm run verify:release

      - name: Confirm generated showcase output is current
        run: npm run check:generated
